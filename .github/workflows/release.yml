name: Release

# 推送形如 v0.1.0 的 tag 时，自动为 Windows / macOS(通用) / Linux 打包并发布到 GitHub Release。
on:
  push:
    tags:
      - 'v*'
  # 也支持在 Actions 页面手动触发（手动触发时不会发布 Release，仅产出构建产物）
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS：构建 Universal（Intel + Apple 芯片）单一包
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin --bundles dmg'
            rustTargets: 'aarch64-apple-darwin,x86_64-apple-darwin'
          # Windows：NSIS 安装包(.exe)
          - platform: 'windows-latest'
            args: '--bundles nsis'
            rustTargets: ''
          # Linux：deb / AppImage
          - platform: 'ubuntu-22.04'
            args: '--bundles deb appimage'
            rustTargets: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rustTargets }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and (on tag) publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # 仅当由 tag 触发时创建/发布 Release；手动触发时只上传 Artifacts
          tagName: ${{ github.ref_name }}
          releaseName: 'Glyph ${{ github.ref_name }}'
          releaseBody: '多平台安装包：Windows(.exe)、macOS(Universal .dmg)、Linux(.deb/.AppImage)。下载对应系统的文件即可安装。'
          releaseDraft: false
          prerelease: false
          includeRelease: ${{ github.ref_type == 'tag' }}
          includeUpdaterJson: false
          args: ${{ matrix.args }}
