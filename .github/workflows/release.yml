name: Release

# 推送形如 v0.1.0 的 tag 时，自动为 Windows / macOS(通用) / Linux 打包并发布到 GitHub Release。
# Linux 因 xcap→libspa 需 PipeWire≥1.2（托管 ubuntu runner 太旧），单独跑在 fedora:41 容器里构建（见 jobs.linux）。
on:
  push:
    tags:
      - 'v*'
  # 也支持在 Actions 页面手动触发（手动触发时不会发布 Release，仅产出构建产物）
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS：Universal（Intel + Apple 芯片）单一包。
          # OCR 已改用原生 Vision，不再依赖 onnxruntime，故 Intel(x86_64) 可构建。
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin --bundles dmg'
            rustTargets: 'aarch64-apple-darwin,x86_64-apple-darwin'
          # Windows：NSIS 安装包(.exe)
          - platform: 'windows-latest'
            args: '--bundles nsis'
            rustTargets: ''
          # Linux 不在此矩阵：托管 ubuntu runner 的 PipeWire 太旧（xcap→libspa 需 ≥1.2），
          # 改由下方独立的 jobs.linux（fedora:41 容器）构建 AppImage + rpm。

    runs-on: ${{ matrix.platform }}

    # 加速 CI：仅在本流水线内放松 release profile（不改仓库配置，本机构建仍用完整优化）。
    # fat LTO + codegen-units=1 是编译耗时大头，关掉后 crate 内可并行、链接时优化关闭。
    env:
      CARGO_PROFILE_RELEASE_LTO: 'false'
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rustTargets }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and (on tag) publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # 仅当由 tag 触发时创建/发布 Release；手动触发时只上传 Artifacts
          tagName: ${{ github.ref_name }}
          releaseName: 'Glyph ${{ github.ref_name }}'
          releaseBody: '多平台安装包：Windows(.exe)、macOS(Universal .dmg，Intel+Apple 芯片)、Linux(.AppImage/.rpm)。下载对应系统的文件即可安装。'
          releaseDraft: false
          prerelease: false
          includeRelease: ${{ github.ref_type == 'tag' }}
          includeUpdaterJson: false
          args: ${{ matrix.args }}

  # Linux：单独跑在 fedora:41 容器里（PipeWire 1.2，满足 xcap→libspa 0.10 编译）。
  # 注意：libspa-sys 的 build.rs 用 bindgen 生成绑定，需系统 libclang.so，
  # 而 fedora:41 纯净镜像不带 clang（托管 ubuntu runner 才预装），故必须显式装 clang/llvm。
  # 链接阶段：arboard→softbuffer→gbm 会 -lgbm，需 mesa-libgbm-devel(提供 libgbm.so) + libdrm-devel。
  # 不动上面已验证的 Win/Mac 矩阵；产物 AppImage + rpm，附到同一个 Release。
  linux:
    name: 'release (linux-fedora41, appimage+rpm)'
    runs-on: ubuntu-24.04
    container:
      image: fedora:41
    env:
      CARGO_PROFILE_RELEASE_LTO: 'false'
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
      # 容器里无 FUSE（/dev/fuse），而 linuxdeploy/appimagetool 本身是 AppImage，
      # 直接执行会因无法挂载而 "failed to run linuxdeploy"。此变量让其解包后运行，绕开 FUSE。
      APPIMAGE_EXTRACT_AND_RUN: '1'
    steps:
      - name: Install Fedora build dependencies
        run: |
          dnf install -y \
            git which curl wget file tar \
            gcc gcc-c++ make pkgconf-pkg-config \
            clang clang-libs llvm \
            mesa-libgbm-devel libdrm-devel \
            openssl-devel webkit2gtk4.1-devel libxdo-devel \
            gtk3-devel glib2-devel libX11-devel libXtst-devel \
            librsvg2-devel pipewire-devel libappindicator-gtk3-devel \
            rpm-build patchelf nodejs npm
      - name: Enable pnpm
        run: npm install -g pnpm@10
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Build (AppImage + rpm) and attach to Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Glyph ${{ github.ref_name }}'
          releaseBody: '多平台安装包：Windows(.exe)、macOS(Universal .dmg，Intel+Apple 芯片)、Linux(.AppImage/.rpm)。下载对应系统的文件即可安装。'
          releaseDraft: false
          prerelease: false
          includeRelease: ${{ github.ref_type == 'tag' }}
          includeUpdaterJson: false
          args: '--bundles appimage rpm'
