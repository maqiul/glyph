[package]
name = "glyph"
version = "0.2.1"
description = "Glyph — A focused Markdown reader"
authors = ["Glyph Contributors"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
# Runtime
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
thiserror = "2"

# Tauri 2
tauri = { version = "2.11.3", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-store = "2"
tauri-plugin-global-shortcut = "2"

# Markdown 解析：渲染全部放前端（markdown-it），后端只负责大纲抽取与编码检测
# 注释：comrak 之前作为后端渲染器，已在前端 markdown-it 替换后移除
# comrak = { version = "0.55", default-features = false, features = ["shortcodes"] }

# 编码检测
chardetng = "0.1"
encoding_rs = "0.8"
# 截图捕获（三平台：Win/mac/Linux-X11；Linux Wayland 走 portal）
xcap = { version = "0.9", features = ["image"] }
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.23"
# 云端 OCR HTTP 客户端（纯 Rust TLS）
ureq = { version = "2", features = ["json"] }
lopdf = "0.36.0"
# PDF 文字提取（纯 Rust，基于 lopdf 内容流解析）
pdf-extract = "0.12"
# PDF 页面渲染为图片（纯 Rust + tiny-skia，无需 pdfium.dll）
pdf_oxide = { version = "0.3.78", features = ["rendering"] }
# 系统剪贴板（将截图/标注图片复制到剪贴板）
arboard = "3"

# OCR 后端按平台分派：非 macOS 用 oar-ocr(ONNX Runtime)；
# macOS 改用原生 Vision（见 ocr_vision.rs / ocr_vision.m），不再依赖 ort，
# 从而支持 Intel(x86_64) + Apple 芯片(arm64) 并可构建 universal 包。
[target.'cfg(not(target_os = "macos"))'.dependencies]
oar-ocr = { version = "0.9", features = ["auto-download"] }

[target.'cfg(target_os = "macos")'.build-dependencies]
cc = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
